name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    environment:
      name: staging
      url: https://staging.nanobot.internal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determine image tag
        id: tag
        run: |
          # workflow_run provides head_sha; workflow_dispatch falls back to github.sha
          RAW_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -z "$RAW_SHA" ]; then
            echo "::error::No SHA available — cannot determine image tag."
            exit 1
          fi
          SHORT_SHA=$(echo "$RAW_SHA" | cut -c1-7)
          echo "image=ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying image: $(grep image= "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Deploy to staging
        run: |
          bash deploy/deploy.sh \
            --env staging \
            --image "${{ steps.tag.outputs.image }}" \
            --timeout 60

      - name: Verify deployment
        run: |
          sleep 10
          BODY=$(curl -sf http://127.0.0.1:18791/health 2>/dev/null || echo '{}')
          STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "failed")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Staging health check failed after deployment (got: $BODY)"
            exit 1
          fi
          echo "Staging deployment verified — health check passed"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::error::Staging deployment failed — dumping diagnostics"
          echo ""
          echo "=== Container status ==="
          docker ps -a --filter name=nanobot-staging --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}" || true
          echo ""
          echo "=== Container logs (last 80 lines) ==="
          docker compose -p nanobot-staging -f deploy/staging/docker-compose.yml logs --tail 80 --no-color 2>&1 || true
          echo ""
          echo "=== Port 18791 listeners ==="
          ss -tlnp sport = :18791 2>/dev/null || netstat -tlnp 2>/dev/null | grep 18791 || true
          echo ""
          echo "=== Disk and memory ==="
          df -h / | tail -1 || true
          free -m | head -3 || true

  notify-skipped:
    name: Notify skipped deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' }}
    steps:
      - name: Annotate skipped deploy
        run: |
          conclusion="${{ github.event.workflow_run.conclusion }}"
          echo "::notice title=Staging Deploy Skipped::Staging deploy was not triggered because the upstream build concluded with: ${conclusion:-unknown}. Staging may be out of date."
